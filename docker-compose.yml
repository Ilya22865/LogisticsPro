version: '3.8'

services:
  # Сервис базы данных MySQL
  db:
    image: mysql:8.0
    container_name: logistics_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-8044}
      MYSQL_DATABASE: logistics_db
      MYSQL_USER: logistics_user
      MYSQL_PASSWORD: ${DB_PASSWORD:-logistics123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - logistics_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Сервис ASP.NET Core API
  api:
    build:
      context: .
      dockerfile: LogisticsWebAPI/Dockerfile
    container_name: logistics_api
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=server=db;port=3306;database=logistics_db;user=logistics_user;password=${DB_PASSWORD:-logistics123}
      - JwtSettings__Key=${JWT_KEY:-YourSuperSecretKeyForLogisticsProApplication2024!}
      - JwtSettings__Issuer=LogisticsPro
      - JwtSettings__Audience=LogisticsProUsers
      - GoogleAuth__ClientID=${GOOGLE_CLIENT_ID}
      - GoogleAuth__ClientSecret=${GOOGLE_CLIENT_SECRET}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logistics_network
    volumes:
      - ./LogisticsWebAPI/Frontend:/app/../Frontend:ro

volumes:
  mysql_data:
    driver: local

networks:
  logistics_network:
    driver: bridge
